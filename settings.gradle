pluginManagement {
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        gradlePluginPortal()
        mavenCentral()
    }
}

rootProject.name = 'playtime-engine'

include 'engine-core'

// The Fabric module needs maven.fabricmc.net and Mojang's servers to resolve
// Minecraft and Loom. Disable it with -PwithFabric=false to build only the engine
// on a machine without that access.
if (providers.gradleProperty('withFabric').getOrElse('false').toBoolean()) {
    include 'fabric'
}
